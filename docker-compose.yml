# Production: API on Vercel, Supabase. This file is local dev + the test database.
services:
  db:  # throwaway Postgres for pytest / eval (TEST_DATABASE_URL default)
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 10
  ui:  # Vite dev server, proxies to the api
    image: node:20-slim
    working_dir: /ui
    volumes: ["./ui:/ui"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    depends_on: [api]
