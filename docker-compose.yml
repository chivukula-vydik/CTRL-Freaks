# Local end to end: Postgres 16 (seeded) + API + review console. Production: API on Vercel, Supabase.
#   cp .env.example .env    (set ADMIN_KEY; ANTHROPIC_API_KEY or MOCK_LLM=true)
#   docker compose up       then open http://localhost:5173 and press "Generate drafts"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uc5            # app data, seeded once on first start; pytest uses the separate "postgres" db
    volumes:
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "uc5"]
      interval: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/uc5   # overrides .env (Supabase) for local runs
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 10
  ui:  # Vite dev server; proxies /api to the api service and adds X-Admin-Key from .env
    image: node:20-slim
    working_dir: /ui
    env_file: .env
    environment:
      VITE_BACKEND_URL: http://api:8000
      VITE_DATA_SOURCE: http
    volumes: ["./ui:/ui", "/ui/node_modules"]   # container keeps its own node_modules (host one may be Windows)
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    depends_on: [api]
